<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravastar 키오스크</title>

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/Gravastar/style.css" />
    <script src="/Gravastar/script.js" defer></script>
  </head>

  <body>
    <h1><img src="./img/Gravastar_logo.svg" alt="" /></h1>

    <div class="menu-wrap">
      <div class="menu-list">
        <!-- 그라바스타 소개 -->
        <div class="menu-block">
          <button class="menu-head" type="button" aria-expanded="false">
            <span class="menu-head__title">그라바스타 소개</span>

            <span class="menu-head__icon">
              <svg class="menu-head__icon-svg" viewBox="0 0 24 24" fill="none">
                <path d="M12 5V19" stroke="currentColor" stroke-width="2" />
                <path d="M5 12H19" stroke="currentColor" stroke-width="2" />
              </svg>
            </span>
          </button>

          <div class="menu-body">
            <div class="menu-body__inner">
              <div class="intro-card">
                <div class="intro-hero">
                  <div class="video-box">
                    <iframe
                      src="https://www.youtube.com/embed/EmEwPB7T9sM?autoplay=1&mute=1&loop=1&playlist=EmEwPB7T9sM&controls=1&rel=0"
                      allow="autoplay; encrypted-media; picture-in-picture"
                      allowfullscreen
                    >
                    </iframe>
                  </div>
                </div>

                <div class="intro-logo">
                  <img src="./img/Gravastar_logo_b.svg" alt="GravaStar 로고" />
                </div>

                <p class="intro-desc">
                  GravaStar는 전자제품, 음악, 예술 등의 다양한 분야의 디자인,
                  엔지니어, 아티스트들이 모여 만든 브랜드입니다.<br />
                  미래지향적 디자인과 첨단 기술을 결합한 가치로 전 세계의 사랑을
                  받고 있습니다.
                </p>

                <div class="intro-qr">
                  <img src="./img/gravastar_qr.svg" alt="QR코드" />
                  <p>[GravaStar 공식 홈페이지]</p>
                </div>

                <div class="intro-divider"></div>

                <h3 class="intro-subtitle en">| SHORTS / REELS |</h3>

                <!-- 릴스 영역 -->
                <div class="video-grid">
                  <div class="video-item">
                    <blockquote
                      class="instagram-media"
                      data-instgrm-permalink="https://www.instagram.com/reel/DTkPTwXErbW/"
                      data-instgrm-version="14"
                    ></blockquote>
                  </div>

                  <div class="video-item">
                    <iframe
                      src="https://www.youtube.com/embed/ONdRIjeVvOU"
                      allowfullscreen
                    >
                    </iframe>
                  </div>
                </div>

                <button class="more-btn">보러가기</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 제품 라인업 -->
        <div class="menu-block">
          <button class="menu-head" type="button">
            <span class="menu-head__title">제품 라인업</span>
            <span class="menu-head__icon">
              <svg class="menu-head__icon-svg" viewBox="0 0 24 24" fill="none">
                <path d="M12 5V19" stroke="currentColor" stroke-width="2" />
                <path d="M5 12H19" stroke="currentColor" stroke-width="2" />
              </svg>
            </span>
          </button>

          <div class="menu-body">
            <div class="menu-body__inner">
              <div class="dummy-box">
                여기에 제품 라인업 콘텐츠를 넣으면 된다.
              </div>
            </div>
          </div>
        </div>

        <!-- 고객가이드 -->
        <div class="menu-block menu-block--link">
          <a
            href="https://gravastarkorea.notion.site/"
            class="menu-head"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="menu-head__title">고객가이드</span>

            <span class="menu-head__icon">
              <svg class="menu-head__icon-svg" viewBox="0 0 24 24" fill="none">
                <path d="M12 5V19" stroke="currentColor" stroke-width="2" />
                <path d="M5 12H19" stroke="currentColor" stroke-width="2" />
              </svg>
            </span>
          </a>
        </div>
      </div>
    </div>

    <!-- Instagram embed script (한 번만) -->
    <script async src="https://www.instagram.com/embed.js"></script>
  </body>
</html>
